# Configures a Chocolatey package source (optionally with credentials).
name: choco-source
description: Registers a Chocolatey package source. Credentials can be fetched directly from Azure Key Vault using the Dev Box Managed Identity.
author: Platform Team
command: ".\\ChocoSource.ps1 -Name {{name}} -Source {{source}} -User {{user}} -KeyVaultName {{keyVaultName}} -KeyVaultSecretName {{keyVaultSecretName}} -Priority {{priority}} -DisableDefaultSource {{disableDefaultSource}}"
inputs:
  name:
    type: string
    defaultValue: ""
    required: true
    description: Friendly name to register the source under (for example, "internal").
  source:
    type: string
    defaultValue: ""
    required: true
    description: URL of the Chocolatey feed (for example, "https://choco.contoso.local/chocolatey").
  user:
    type: string
    defaultValue: ""
    required: false
    description: Username for the feed. Leave empty for anonymous feeds.
  keyVaultName:
    type: string
    defaultValue: ""
    required: false
    description: Name of the Azure Key Vault containing the feed password (e.g. "myvault").
  keyVaultSecretName:
    type: string
    defaultValue: ""
    required: false
    description: Name of the secret in the Key Vault that holds the feed password (e.g. "choco-feed-password").
  priority:
    type: string
    defaultValue: ""
    required: false
    description: Optional priority for the source (lower = higher priority).
  disableDefaultSource:
    type: string
    defaultValue: "false"
    required: false
    description: Set to "true" to disable the public chocolatey.org community source after registering this one.
