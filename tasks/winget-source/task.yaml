# Registers a private Winget REST source. Any required authentication (for
# example, an Azure Function key) should be embedded in the source URL as a
# query string parameter, since winget's `--header` flag only sets the single
# Windows-Package-Manager protocol header, not arbitrary HTTP headers.
name: winget-source
description: Registers a private Winget REST source.
author: Platform Team
command: ".\\WingetSource.ps1 -Name {{name}} -Source {{source}} -TrustLevel {{trustLevel}} -RemoveDefaultSources {{removeDefaultSources}}"
inputs:
  name:
    type: string
    defaultValue: ""
    required: true
    description: Friendly name to register the source under (for example, "internal").
  source:
    type: string
    defaultValue: ""
    required: true
    description: >-
      URL of the Winget REST source. If the endpoint requires authentication
      (for example, an Azure Function), include the secret in the URL query
      string and resolve it from Key Vault using the "{{<KEY_VAULT_SECRET_URI>}}"
      placeholder syntax, e.g.
      https://func.example.com/api?code={{https://kv.vault.azure.net/secrets/winget-key}}
  trustLevel:
    type: string
    defaultValue: "trusted"
    required: false
    description: Trust level for the source. One of "trusted" or "none".
  removeDefaultSources:
    type: string
    defaultValue: "false"
    required: false
    description: Set to "true" to remove the public winget/msstore sources after registering this one.
