$schema: "1.0"
name: "choco-team"
description: "Team dev box that installs core development tools using Chocolatey instead of Winget"
image: microsoftvisualstudio_visualstudioplustools_vs-2022-ent-general-win11-m365-gen2

tasks:
  - name: choco
    displayName: "Install Visual Studio Code (Chocolatey)"
    parameters:
      package: vscode
  - name: choco
    displayName: "Install Git (Chocolatey)"
    parameters:
      package: git
  - name: choco
    displayName: "Install 7-Zip (Chocolatey)"
    parameters:
      package: 7zip
