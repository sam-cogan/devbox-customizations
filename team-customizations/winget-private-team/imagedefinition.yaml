$schema: "1.0"
name: "winget-private-team"
description: "Team dev box that installs packages from a private Winget REST source fronted by an Azure Function. The function key is pulled from Azure Key Vault."

# Base image
image: microsoftvisualstudio_visualstudioplustools_vs-2022-ent-general-win11-m365-gen2

# Join the image build VM to a dev-center attached network connection so it can reach
# the private Winget source (and any other internal endpoints). The network connection
# below must already be attached to the dev center in Sweden Central.
buildProperties:
  networkConnection: "nc-devbox-sweden"

tasks:
  # 1. Register the private Winget source. The Azure Function key is embedded
  #    in the source URL's `?code=` query string and resolved from Key Vault by
  #    the Dev Box service using the {{secret_URI}} placeholder syntax. This is
  #    used instead of a custom HTTP header because winget's `--header` flag
  #    only sets the Windows-Package-Manager protocol header, not arbitrary
  #    headers like `x-functions-key`. Replace the vault name, secret name, and
  #    source URL to match your environment.
  - name: winget-source
    displayName: "Register private Winget source"
    parameters:
      name: internal
      source: "https://func-winget-poc.azurewebsites.net/api?code={{https://kv-choco-devbox.vault.azure.net/secrets/winget-key}}"
      trustLevel: trusted
      removeDefaultSources: "true"
  - name: ~/powershell
    displayName: "Install Visual Studio Code (private feed)"
    parameters:
      command: |
        Import-Module Microsoft.WinGet.Client -ErrorAction Stop
        Install-WinGetPackage -Id Microsoft.VisualStudioCode -Source internal -Mode Silent -Scope SystemOrUnknown
  - name: ~/powershell
    displayName: "Install Git (private feed)"
    parameters:
      command: |
        Import-Module Microsoft.WinGet.Client -ErrorAction Stop
        Install-WinGetPackage -Id Git.Git -Source internal -Mode Silent -Scope SystemOrUnknown
  - name: ~/powershell
    displayName: "Install 7-Zip (private feed)"
    parameters:
      command: |
        Import-Module Microsoft.WinGet.Client -ErrorAction Stop
        Install-WinGetPackage -Id 7zip.7zip -Source internal -Mode Silent -Scope SystemOrUnknown

userTasks:
  - name: ~/powershell
    displayName: "Install Notepad++ (private feed)"
    parameters:
      command: |
        Import-Module Microsoft.WinGet.Client -ErrorAction Stop
        Install-WinGetPackage -Id Notepad++.Notepad++ -Source internal -Mode Silent
  - name: ~/powershell
    displayName: "Configure Git Identity"
    parameters:
      command: |
        Write-Host "Configuring default Git settings..."
        git config --global init.defaultBranch main
        git config --global core.autocrlf true
        git config --global pull.rebase true
        Write-Host "Git default settings configured."
  - name: ~/git-clone
    displayName: "Clone Team Repository"
    parameters:
      repositoryUrl: https://github.com/sam-cogan/TeamCustomizations
      directory: D:\Repos\TeamCustomizations
