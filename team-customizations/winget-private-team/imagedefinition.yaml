  #       if (-not $winget) { throw "winget.exe not found" }
  #       & $winget install --id Microsoft.VisualStudioCode --source internal --silent --accept-package-agreements --accept-source-agreements --scope machine
  #       if ($LASTEXITCODE -ne 0) { throw "winget install failed with exit code $LASTEXITCODE" }
