$schema: "1.0"
name: "choco-private-team"
description: "Team dev box that installs packages from a private Chocolatey feed reached over a VNet. Credentials are pulled from Azure Key Vault."

# Base image
image: microsoftvisualstudio_visualstudioplustools_vs-2022-ent-general-win11-m365-gen2

# Join the image build VM to a dev-center attached network connection so it can reach
# the private Chocolatey feed (and any other internal endpoints). The network connection
# below must already be attached to the dev center in Sweden Central.
buildProperties:
  networkConnection: "nc-devbox-sweden"

tasks:
  # 1. Provision a Dev Drive (ReFS) at Z: as a 100 GB dynamically expanding VHDX.
  #    Uses the custom dev-drive task from this catalog. No Chocolatey package required.
  - name: ~/dev-drive
    displayName: "Create Dev Drive (Z:, 100 GB VHDX)"
    parameters:
      type: vhdx
      driveLetter: Z
      size: "102400"

  # 2. Enable Windows Subsystem for Linux and install Ubuntu in a single step.
  #    `wsl --install -d Ubuntu` enables the WSL + VirtualMachinePlatform optional
  #    features and registers Ubuntu as the default distro. No Chocolatey package required.
  - name: ~/powershell
    displayName: "Enable WSL and install Ubuntu"
    parameters:
      command: |
        $ProgressPreference = 'SilentlyContinue'
        Write-Host "Enabling WSL and installing Ubuntu..."
        wsl --install -d Ubuntu --no-launch
        Write-Host "WSL + Ubuntu install requested. A reboot will complete the setup."

  # 3. Enable the Windows Sandbox optional feature. Requires a reboot, which the
  #    Dev Box image build pipeline performs between tasks. No Chocolatey package required.
  - name: ~/powershell
    displayName: "Enable Windows Sandbox"
    parameters:
      command: |
        $ProgressPreference = 'SilentlyContinue'
        Write-Host "Enabling Windows Sandbox (Containers-DisposableClientVM)..."
        $result = Enable-WindowsOptionalFeature -FeatureName "Containers-DisposableClientVM" -All -Online -NoRestart
        if ($result.RestartNeeded) {
          Write-Host "Windows Sandbox feature enabled. A restart is required to complete installation."
        }

  # 4. Register the private feed, with credentials resolved from Key Vault
  #    by the Dev Box service using the {{secret_URI}} placeholder syntax.
  #    Replace the vault name, secret name, and source URL to match your environment.
  - name: choco-source
    displayName: "Register private Chocolatey feed"
    parameters:
      name: internal
      source: http://10.0.1.5:8081/repository/choco-hosted/
      user: "{{https://kv-choco-devbox.vault.azure.net/secrets/choco-feed-user}}"
      password: "{{https://kv-choco-devbox.vault.azure.net/secrets/choco-feed-password}}"
      priority: "1"
      disableDefaultSource: "true"
  - name: choco
    displayName: "Install Visual Studio Code (private feed)"
    parameters:
      package: vscode
  - name: choco
    displayName: "Install Git (private feed)"
    parameters:
      package: git
  - name: choco
    displayName: "Install 7-Zip (private feed)"
    parameters:
      package: 7zip

userTasks:
  - name: choco
    displayName: "Install Notepad++ (private feed)"
    parameters:
      package: notepadplusplus
  - name: ~/powershell
    displayName: "Configure Git Identity"
    parameters:
      command: |
        Write-Host "Configuring default Git settings..."
        git config --global init.defaultBranch main
        git config --global core.autocrlf true
        git config --global pull.rebase true
        Write-Host "Git default settings configured."
  - name: ~/git-clone
    displayName: "Clone Team Repository"
    parameters:
      repositoryUrl: https://github.com/sam-cogan/TeamCustomizations
      directory: D:\Repos\TeamCustomizations
