$schema: "1.0"
name: "choco-private-team"
description: "Team dev box that installs packages from a private Chocolatey feed reached over a VNet. Credentials are pulled from Azure Key Vault."

# Base image
image: microsoftvisualstudio_visualstudioplustools_vs-2022-ent-general-win11-m365-gen2

# Join the image build VM to a dev-center attached network connection so it can reach
# the private Chocolatey feed (and any other internal endpoints). The network connection
# below must already be attached to the dev center in Sweden Central.
buildProperties:
  networkConnection: "nc-devbox-sweden"

tasks:
  # 1. Provision a Dev Drive (ReFS) at Z: as a 100 GB dynamically expanding VHDX.
  #    Uses the custom dev-drive task from this catalog. No Chocolatey package required.
  - name: dev-drive
    displayName: "Create Dev Drive (Z:, 100 GB VHDX)"
    parameters:
      type: vhdx
      driveLetter: Z
      size: "102400"

  # 2. Enable WSL, VirtualMachinePlatform, and Windows Sandbox optional features
  #    using DISM with /norestart so the customization task exits cleanly.
  #    Dev Box image definitions do not support mid-build reboots: any non-zero
  #    exit code (including the Windows 3010 "reboot required" convention) is
  #    treated as a task failure by the Dev Box customization agent. The pending
  #    feature changes are finalized when the developer's dev box boots for the
  #    first time after the image is deployed. The actual Ubuntu distro install
  # #    is deferred to userTasks (post first sign-in) where WSL is functional.
  # - name: ~/powershell
  #   displayName: "Enable WSL, VirtualMachinePlatform, and Windows Sandbox features"
  #   parameters:
  #     command: |
  #       $ProgressPreference = 'SilentlyContinue'
  #       Write-Host "Enabling Microsoft-Windows-Subsystem-Linux..."
  #       dism.exe /online /enable-feature /featurename:Microsoft-Windows-Subsystem-Linux /all /norestart | Out-Host
  #       Write-Host "Enabling VirtualMachinePlatform..."
  #       dism.exe /online /enable-feature /featurename:VirtualMachinePlatform /all /norestart | Out-Host
  #       Write-Host "Enabling Containers-DisposableClientVM (Windows Sandbox)..."
  #       dism.exe /online /enable-feature /featurename:Containers-DisposableClientVM /all /norestart | Out-Host
  #       Write-Host "Optional features staged. They will finalize on first boot of the dev box."

  # 3. Register the private feed, with credentials resolved from Key Vault
  #    by the Dev Box service using the {{secret_URI}} placeholder syntax.
  #    Replace the vault name, secret name, and source URL to match your environment.
  - name: choco-source
    displayName: "Register private Chocolatey feed"
    parameters:
      name: internal
      source: http://10.0.1.5:8081/repository/choco-hosted/
      user: "{{https://kv-choco-devbox.vault.azure.net/secrets/choco-feed-user}}"
      password: "{{https://kv-choco-devbox.vault.azure.net/secrets/choco-feed-password}}"
      priority: "1"
      disableDefaultSource: "true"
  - name: choco
    displayName: "Install Visual Studio Code (private feed)"
    parameters:
      package: vscode
  - name: choco
    displayName: "Install Git (private feed)"
    parameters:
      package: git
  - name: choco
    displayName: "Install 7-Zip (private feed)"
    parameters:
      package: 7zip

userTasks:
  # Install the Ubuntu WSL distro after first sign-in. The WSL + VirtualMachinePlatform
  # optional features were staged during the image build and finalized on the first
  # boot, so `wsl --install` here just registers the distro.
  - name: ~/powershell
    displayName: "Install Ubuntu WSL distro"
    parameters:
      command: |
        $ProgressPreference = 'SilentlyContinue'
        Write-Host "Installing Ubuntu WSL distro..."
        wsl --install -d Ubuntu --no-launch
        Write-Host "Ubuntu install requested."
  - name: choco
    displayName: "Install Notepad++ (private feed)"
    parameters:
      package: notepadplusplus
  - name: ~/powershell
    displayName: "Configure Git Identity"
    parameters:
      command: |
        Write-Host "Configuring default Git settings..."
        git config --global init.defaultBranch main
        git config --global core.autocrlf true
        git config --global pull.rebase true
        Write-Host "Git default settings configured."
  - name: ~/git-clone
    displayName: "Clone Team Repository"
    parameters:
      repositoryUrl: https://github.com/sam-cogan/TeamCustomizations
      directory: D:\Repos\TeamCustomizations
